<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f19" />
<title>Roster · Deliverance Railroad Union</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/emblem-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="assets/emblem.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="css/styles.css?v=v2d" />
</head>
<body>
  <a class="skip" href="#main">Skip to the roster</a>
  <header class="rail-top" id="railTop"></header>
  <section class="hero " data-cam="roster" aria-label="Roster">
    <div class="hero-title" aria-hidden="true"><span>Roster</span></div>
    <img class="hero-still" src="assets/3d/loco-hero.png" alt="" />
    <div class="hero-copy">
      <p class="kicker">Union Office · Est. 1899</p>
      <h1 class="reveal-words">Every hand on the line</h1>
      <p class="sub">The books of the Deliverance Railroad Union: who drives, who is learning the road, and who holds the throttle.</p>
      <div class="hero-actions"><button class="btn primary hide" id="addMemberBtn" type="button">Add to roster</button><button class="btn hide" id="exportBtn" type="button">Data download</button></div>
    </div>
  </section>
  <main class="page" id="main">
    <div id="claimBanner"></div>
    <section class="card board rv"><div class="tiles" id="tiles"></div></section>

    <h2 class="section-label rv"><b>Personnel</b><span id="countLine">Loading the roster&hellip;</span></h2>
    <section class="card rv">
      <div class="toolbar" style="margin-bottom:16px">
        <input class="search" id="q" type="search" placeholder="Search name, train, PO&hellip;" autocomplete="off" aria-label="Search the roster" />
        <select class="filter" id="gradeFilter" aria-label="Grade"><option value="">All grades</option></select>
        <select class="filter" id="statusFilter" aria-label="Status"><option value="">All statuses</option></select>
        <label style="display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-2);width:auto;white-space:nowrap">
          <input type="checkbox" id="hideDeparted" checked /> Hide departed
        </label>
      </div>
      <div class="table-wrap">
        <table class="rr">
          <thead><tr>
            <th>Name</th><th>Grade</th><th>Status</th><th>PO</th>
            <th class="num">Trains</th><th>Probation</th><th class="duty-col">Last on duty</th><th class="note-col">Note</th>
          </tr></thead>
          <tbody id="rosterBody"><tr><td colspan="8" class="empty">Loading&hellip;</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

<script src="js/app.js?v=v2d"></script>
<script src="js/roster.js?v=v2d"></script>
<script type="module" src="js/hero3d.js?v=v2d"></script>
</body>
</html>
