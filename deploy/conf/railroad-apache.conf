# Deliverance Railroad Union — Apache hardening.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The pages carry no cache-buster of their own (only the CSS/JS they pull do),
# so a browser holding a stale index.html would show an old layout and miss
# newly added controls entirely - which is exactly how the Data download button
# went missing for Mac on 2026-09-23. Always revalidate the HTML; the versioned
# assets it references can still be cached hard.
# Wrapped: an unknown directive stops Apache from starting at all, and
# mod_headers is not guaranteed to be loaded in the stock php:8.2-apache image.
<IfModule mod_headers.c>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
</IfModule>
