services:
  railroad-union:
    image: php:8.2-apache
    container_name: railroad-union
    restart: unless-stopped
    ports:
      - "8086:80"
    # mod_headers is not enabled in the stock image, and the conf needs it to
    # stop browsers holding a stale index.html (which is how the Data download
    # button stayed invisible after it shipped). Enabling it here rather than
    # by hand keeps it across a recreate.
    command: bash -c "a2enmod headers && exec apache2-foreground"
    environment:
      RAILROAD_DATA_DIR: /data
      TZ: America/Los_Angeles
    volumes:
      # The site. Read-only: the app never writes into its own web root.
      - /volume1/web/railroad-union:/var/www/html:ro
      # Database, config and sessions. Outside the web root on purpose,
      # because nginx/Apache here have no per-directory deny to hide them.
      - /volume1/docker/railroad-union/data:/data
      - /volume1/docker/railroad-union/conf/railroad.ini:/usr/local/etc/php/conf.d/railroad.ini:ro
      - /volume1/docker/railroad-union/conf/railroad-apache.conf:/etc/apache2/conf-enabled/railroad.conf:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login.html') ? 0 : 1);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nightly backup, on the NAS rather than from the Mac. The Mac's ranch job
  # skips whenever /Volumes/docker is unmounted - any time it is asleep - and
  # this database has other people writing to it. Same image, so nothing extra
  # to pull; it only needs the data directory and somewhere to write.
  railroad-backup:
    image: php:8.2-apache
    container_name: railroad-backup
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      BACKUP_AT: "03:10"
    volumes:
      # Not :ro - a SQLite reader in WAL mode needs write access to the -shm
      # file. The backup script itself never writes to the database.
      - /volume1/docker/railroad-union/data:/data
      - /volume1/docker/railroad-union/backups:/backups
      - /volume1/docker/railroad-union/bin/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "railroad-backup: nightly at $$BACKUP_AT ($$TZ)"
        while true; do
          now=$$(date +%H:%M)
          if [ "$$now" = "$$BACKUP_AT" ]; then
            bash /usr/local/bin/backup.sh
            sleep 61
          fi
          sleep 20
        done
